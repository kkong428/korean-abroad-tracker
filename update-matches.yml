name: 일정 자동 갱신
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 일정 가져오기
        run: node scripts/update-matches.js
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      - name: 바뀐 게 있으면 저장
        run: |
          if [ -n "$(git status --porcelain data/matches.json)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add data/matches.json
            git commit -m "일정 자동 갱신"
            git push
          fi
